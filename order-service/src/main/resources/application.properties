spring.application.name=order-service
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ordersdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Enable circuit breaker for Feign clients
spring.cloud.openfeign.circuitbreaker.enabled=true

spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=artemis
spring.artemis.password=artemis

# Circuit breaker config: open after 3 failures in a window of 5 calls
resilience4j.circuitbreaker.instances.user-service.slidingWindowSize=5
resilience4j.circuitbreaker.instances.user-service.failureRateThreshold=60
resilience4j.circuitbreaker.instances.user-service.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.restaurant-service.slidingWindowSize=5
resilience4j.circuitbreaker.instances.restaurant-service.failureRateThreshold=60
resilience4j.circuitbreaker.instances.restaurant-service.waitDurationInOpenState=10s